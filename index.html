<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a19">
  <meta name="description" content="Soundcraft Ui24R - interaktywne demo miksera.">
  <title>Soundcraft Ui24R | Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #171a19;
      color: #f1f2ef;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { min-width: 320px; min-height: 100dvh; display: grid; grid-template-rows: 58px minmax(0, 1fr); overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; border-bottom: 1px solid #343a37; background: #171a19; }
    .identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .mark { color: #f05a43; font-size: 15px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: 14px; line-height: 1; font-weight: 650; }
    .subtitle { margin-top: 4px; color: #9ca39f; font-size: 11px; }
    .demo-link { display: inline-flex; align-items: center; gap: 7px; color: #dce0dd; font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .demo-link:hover { color: #f05a43; }
    .demo-link svg { width: 15px; height: 15px; }
    main { min-height: 0; background: #101211; }
    .mixer-frame { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 480px) {
      body { grid-template-rows: 54px minmax(0, 1fr); }
      .topbar { padding: 0 12px; }
      h1 { font-size: 13px; }
      .demo-link { font-size: 11px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .topbar { animation: arrive 420ms ease-out both; }
      @keyframes arrive {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <span class="mark" aria-hidden="true">SOUNDCRAFT</span>
      <div>
        <h1>Ui24R</h1>
        <div class="subtitle">Software demo</div>
      </div>
    </div>
    <a class="demo-link" href="https://www.soundcraft.com/ui24-software-demo/mixer.html" target="_blank" rel="noopener noreferrer">
      Otwórz demo
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M14 4h6v6M20 4 11 13" />
        <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" />
      </svg>
    </a>
  </header>
  <main>
    <iframe class="mixer-frame" title="Soundcraft Ui24R software demo" src="https://www.soundcraft.com/ui24-software-demo/mixer.html" loading="eager" allow="autoplay; fullscreen"></iframe>
  </main>
</body>
</html>
